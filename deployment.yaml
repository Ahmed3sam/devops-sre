apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "prod-deben-backend-role"
        vault.hashicorp.com/agent-inject-secret-prod-deben-backend: "secret/prod-deben-backend"
        vault.hashicorp.com/agent-inject-template-prod-deben-backend: |
          {{- with secret "secret/prod-deben-backend" -}}
          test={{ .Data.data.test }}
          {{- end }}
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
